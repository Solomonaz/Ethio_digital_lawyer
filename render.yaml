# Render Blueprint for the EthioLex FastAPI backend.
# In Render: New + → "Blueprint" → pick this repo. It reads this file and
# creates the service. Then set the secret values (marked sync: false) in the
# Render dashboard (Environment tab) — never commit real secrets.
services:
  - type: web
    name: ethiolex-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # --- Secrets: set these in the Render dashboard (do NOT commit values) ---
      - key: DATABASE_URL          # postgresql://...@db.<ref>.supabase.co:5432/postgres?sslmode=require
        sync: false
      - key: SUPABASE_URL          # https://<ref>.supabase.co
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY            # any long random string for JWT signing
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # --- Optional (only if you use them) ---
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: CHAPA_WEBHOOK_SECRET
        sync: false
